name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_on:
        description: Modo opcional do quality gate
        required: false
        default: never
        type: choice
        options:
          - never
          - no-go
          - go-with-risks

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute source validation and tests
        run: npm run check
      - name: Generate evidence-aware quality report
        run: node src/cli.js analyze-pr --change examples/payment-refactor.change.json --evidence-manifest examples/evidence-manifest.json --fail-on "${{ inputs.fail_on || 'never' }}" --out reports
      - name: Upload quality evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aima-quality-report
          path: reports/
          if-no-files-found: error
