name: MCP integration

on:
  push:
    branches: [main]
    paths:
      - 'integrations/mcp/**'
      - 'src/**'
      - 'aima/**'
      - 'examples/**'
      - '.github/workflows/mcp-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/mcp/**'
      - 'src/**'
      - 'aima/**'
      - 'examples/**'
      - '.github/workflows/mcp-integration.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/mcp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: integrations/mcp/package-lock.json
      - name: Install MCP adapter dependencies
        run: npm ci
      - name: Check syntax and run the MCP adapter suite
        run: npm run check
