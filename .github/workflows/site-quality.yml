name: Site quality

on:
  pull_request:
    paths:
      - 'site/**'
      - 'integrations/site-quality/**'
      - '.github/workflows/site-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Site visual & a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the public site
        run: npm run build:site
      - name: Install site-quality dependencies
        working-directory: integrations/site-quality
        run: npm ci
      - name: Audit site-quality dependencies
        working-directory: integrations/site-quality
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: integrations/site-quality
        run: npx playwright install --with-deps chromium
      - name: Run visual & accessibility suite
        working-directory: integrations/site-quality
        run: npm test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-report
          path: |
            integrations/site-quality/playwright-report/
            integrations/site-quality/test-results/
          if-no-files-found: ignore
